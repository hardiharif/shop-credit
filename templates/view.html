<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers · Shop Credit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Shop Credit</a>
    <nav class="nav" aria-label="Main navigation">
      <a class="nav-link" href="{{ url_for('home') }}">Home</a>
      <a class="nav-link active" href="{{ url_for('view') }}">View</a>
      <a class="button button-primary" href="{{ url_for('add') }}">+ Add</a>
    </nav>
  </header>

  <main class="page-shell">
    <h1>Customers</h1>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone number</th>
            <th>Date</th>
            <th>Outstanding amount</th>
            <th>SMS sent</th>
          </tr>
        </thead>
        <tbody id="customer-list">
          <tr><td class="empty-state" colspan="5">No customers yet.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const customerList = document.getElementById('customer-list');
    const customers = JSON.parse(localStorage.getItem('shopCreditCustomers') || '[]');

    if (customers.length) {
      customerList.innerHTML = customers.map((customer) => `
        <tr>
          <td data-label="Name">${escapeHtml(customer.name)}</td>
          <td data-label="Phone number">${escapeHtml(customer.phone)}</td>
          <td data-label="Date">${escapeHtml(customer.date)}</td>
          <td data-label="Outstanding amount">${escapeHtml(customer.amount)}</td>
          <td data-label="SMS sent">No</td>
        </tr>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }
  </script>
</body>
</html>
